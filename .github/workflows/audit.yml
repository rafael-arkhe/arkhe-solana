name: Security Audit

on:
  push:
    paths:
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'Cargo.lock'
  schedule:
    - cron: '0 0 * * 0' # run every sunday

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: rustsec/audit-check@v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: "RUSTSEC-2026-0258,RUSTSEC-2026-0174,RUSTSEC-2024-0384,RUSTSEC-2026-0097,RUSTSEC-2026-0194,RUSTSEC-2026-0195"
