name: Security Audit

on:
  push:
    paths:
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'Cargo.lock'
  schedule:
    - cron: '0 0 * * 0' # run every sunday

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Check for rsa in dependency tree
        run: |
          if cargo tree -i rsa 2>/dev/null | grep -q "rsa"; then
            echo "rsa is in the dependency tree. Verify it's only a transitive non-compiled dependency."
          fi
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Run cargo audit
        run: cargo audit
