name: L4 Governance Tests

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'crates/l4-governance/**'

jobs:
  test-l4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p arkhe-openclaw -p arkhe-ann-spec
