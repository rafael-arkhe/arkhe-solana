[package]
name = "arkhe-attestation"
version = "0.1.0"
edition = "2021"
description = "Attestation graph, freshness check, and fail-closed gate for arkhe-solana"
license = "MIT OR Apache-2.0"

[lib]
name = "arkhe_attestation"
path = "src/lib.rs"

[[bin]]
name = "arkhe-attest"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1.5"
chrono = "0.4.45"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
