[advisories]
ignore = [
    # Non-constant-time mask generation and `u128` comparisons in ctutils.
    # Safe to ignore because this is a transitive dependency deep inside our graph,
    # and we do not use `u128` constant-time ops for sensitive data directly.
    "RUSTSEC-2026-0385",

    # `AsyncFd::new` and related constructors violate I/O safety in tokio.
    # Safe to ignore for now because our usage of tokio doesn't rely on raw FDs
    # passing across thread boundaries in an unsafe manner.
    "RUSTSEC-2026-0386",
]
